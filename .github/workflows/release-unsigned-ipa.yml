name: Release Unsigned IPA
run-name: Release Unsigned IPA (${{ github.ref_name }})

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_NAME: Pixwift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned ipa with project script
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          EXPORT_DIR="$ARTIFACTS_DIR/unsigned-ipa"
          mkdir -p "$ARTIFACTS_DIR"
          mkdir -p "$EXPORT_DIR"
          touch "$ARTIFACTS_DIR/build-ipa.log"
          ./scripts/build_ipa.sh --clean -v 2>&1 | tee "$ARTIFACTS_DIR/build-ipa.log"
          OUTPUT_IPA="$EXPORT_DIR/$APP_NAME-${GITHUB_REF_NAME}-unsigned.ipa"
          cp "build/$APP_NAME.ipa" "$OUTPUT_IPA"
          echo "output_ipa=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_IPA"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.output_ipa }}
            artifacts/build-ipa.log

      - name: Upload release ipa artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Pixwift-release-unsigned-ipa
          path: ${{ steps.build.outputs.output_ipa }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-build-ipa-log
          path: artifacts/build-ipa.log
          if-no-files-found: error
