name: Release Unsigned IPA
run-name: Release Unsigned IPA (${{ github.ref_name }})

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_NAME: Pixwift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned ipa
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          EXPORT_DIR="$ARTIFACTS_DIR/unsigned-ipa"
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          DERIVED_DATA_PATH="$BUILD_DIR/derived_data"
          PROJECT_FILE="Pixiv-SwiftUI.xcodeproj"
          SCHEME_NAME="Release"
          CONFIGURATION="Release"
          JOBS="$(sysctl -n hw.ncpu)"
          mkdir -p "$ARTIFACTS_DIR"
          mkdir -p "$EXPORT_DIR"
          mkdir -p "$BUILD_DIR"

          XCODEBUILD_CMD=(
            xcodebuild
            -project "$PROJECT_FILE"
            -scheme "$SCHEME_NAME"
            -sdk iphoneos
            -configuration "$CONFIGURATION"
            -destination "generic/platform=iOS"
            -derivedDataPath "$DERIVED_DATA_PATH"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            -jobs "$JOBS"
            -skipPackagePluginValidation
          )

          "${XCODEBUILD_CMD[@]}" clean build 2>&1 | tee "$ARTIFACTS_DIR/build-ipa.log"

          rm -rf "$BUILD_DIR/Payload"
          mkdir -p "$BUILD_DIR/Payload"

          APP_PATH="$(find "$DERIVED_DATA_PATH" -type d -path "*/Release-iphoneos/${APP_NAME}.app" | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Failed to locate built app in $DERIVED_DATA_PATH" >&2
            find "$DERIVED_DATA_PATH" -maxdepth 5 -type d | sort
            exit 1
          fi

          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"

          if [ ! -f "$BUILD_DIR/Payload/${APP_NAME}.app/${APP_NAME}" ]; then
            echo "Missing app executable after packaging copy" >&2
            exit 1
          fi

          (
            cd "$BUILD_DIR"
            rm -f "${APP_NAME}.ipa"
            /usr/bin/zip -9 -r "${APP_NAME}.ipa" Payload
          )

          OUTPUT_IPA="$EXPORT_DIR/$APP_NAME-${GITHUB_REF_NAME}-unsigned.ipa"
          cp "$BUILD_DIR/$APP_NAME.ipa" "$OUTPUT_IPA"
          echo "output_ipa=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_IPA"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.output_ipa }}
            artifacts/build-ipa.log

      - name: Upload release ipa artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Pixwift-release-unsigned-ipa
          path: ${{ steps.build.outputs.output_ipa }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-build-ipa-log
          path: artifacts/build-ipa.log
          if-no-files-found: error
