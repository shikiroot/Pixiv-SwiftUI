name: Build Unsigned IPA
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual IPA build ({0})', github.event.inputs.ref_name) || format('Build Unsigned IPA ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: Git ref to build
        required: true
        default: tweak
        type: string
      artifact_name:
        description: Artifact name
        required: true
        default: Pixwift-unsigned-ipa
        type: string
  push:
    branches:
      - tweak

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_NAME: Pixwift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref_name || github.ref }}

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned ipa with project script
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          EXPORT_DIR="$ARTIFACTS_DIR/unsigned-ipa"
          mkdir -p "$ARTIFACTS_DIR"
          mkdir -p "$EXPORT_DIR"
          touch "$ARTIFACTS_DIR/build-ipa.log"
          ./scripts/build_ipa.sh --clean -v 2>&1 | tee "$ARTIFACTS_DIR/build-ipa.log"
          cp "build/$APP_NAME.ipa" "$EXPORT_DIR/$APP_NAME-unsigned.ipa"
          ls -lh "$EXPORT_DIR/$APP_NAME-unsigned.ipa"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_name || 'Pixwift-unsigned-ipa' }}
          path: |
            artifacts/unsigned-ipa/${{ env.APP_NAME }}-unsigned.ipa
            artifacts/build-ipa.log
          if-no-files-found: error
