name: Release Unsigned IPA
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual release build ({0})', github.event.inputs.ref_name) || format('Release Unsigned IPA ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: Git ref to build
        required: true
        default: tweak
        type: string
      artifact_name:
        description: Artifact name
        required: true
        default: Pixwift-unsigned-ipa
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_NAME: Pixwift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref_name || github.ref }}

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned ipa with project script
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          EXPORT_DIR="$ARTIFACTS_DIR/unsigned-ipa"
          mkdir -p "$ARTIFACTS_DIR"
          mkdir -p "$EXPORT_DIR"
          touch "$ARTIFACTS_DIR/build-ipa.log"
          ./scripts/build_ipa.sh --clean -v 2>&1 | tee "$ARTIFACTS_DIR/build-ipa.log"
          RELEASE_NAME="${GITHUB_REF_NAME:-manual}"
          OUTPUT_IPA="$EXPORT_DIR/$APP_NAME-$RELEASE_NAME-unsigned.ipa"
          cp "build/$APP_NAME.ipa" "$OUTPUT_IPA"
          echo "output_ipa=$OUTPUT_IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_IPA"

      - name: Publish release asset
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.output_ipa }}
            artifacts/build-ipa.log

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_name || 'Pixwift-unsigned-ipa' }}
          path: ${{ steps.build.outputs.output_ipa }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-ipa-log
          path: artifacts/build-ipa.log
          if-no-files-found: error
